# AXGuard Security Review — Actions dogfood (no always-on webhook required).
# Full GitHub App Check Runs: docs/github/install.md + docs/github/self-hosting.md
name: axguard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: axguard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install AXGuard
        run: python -m pip install -e .

      # Dogfood shipped runtime code. fixtures/, skills/, commands/, and rules/
      # intentionally contain vulnerable examples for regression tests.
      - name: Security review (fail on high+)
        run: |
          axguard audit engines --fail-on high --no-banner
          axguard audit cli --fail-on high --no-banner
