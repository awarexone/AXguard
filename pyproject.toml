[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axguard"
version = "0.2.0"
description = "Pre-ship security gate for source and build artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
mcp = ["mcp>=1.9"]
dev = ["pytest>=7.0", "httpx>=0.27"]

[project.scripts]
axguard = "cli.main:main"

[tool.setuptools.packages.find]
include = ["cli*", "engines*"]

[tool.setuptools.package-data]
# rules live at repo root; include via data files for editable installs
"*" = []

[tool.setuptools.data-files]
"share/axguard/rules" = [
  "rules/secrets.json",
  "rules/injection.json",
  "rules/ssrf.json",
  "rules/auth.json",
  "rules/xss.json",
  "rules/cloud.json",
  "rules/agent.json",
  "rules/sql.json",
  "rules/ssti.json",
  "rules/path.json",
  "rules/crypto.json",
  "rules/supply.json",
  "rules/graphql.json",
  "rules/upload.json",
  "rules/debug.json",
  "rules/advanced.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
